name: docker-smoke

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t haskell-stakeholder .
      - run: docker run --rm haskell-stakeholder --list-values
      - run: docker run --rm haskell-stakeholder --dev-type backend --complexity medium --seed docker-code --focus-family code_analyzer --output-format json
      - run: docker run --rm haskell-stakeholder --dev-type backend --complexity medium --seed docker-data --focus-family data_processing --output-format json
      - run: docker run --rm haskell-stakeholder --dev-type fullstack --complexity medium --seed docker-agent --focus-family agent_workflows --output-format json
      - run: docker run --rm haskell-stakeholder --dev-type dev-ops --complexity high --seed docker-delivery --focus-family delivery_preview_ops --output-format json
      - run: |
          if docker run --rm haskell-stakeholder --experimental-provider openai-compatible; then
            echo "expected experimental-provider to fail fast" >&2
            exit 1
          fi
