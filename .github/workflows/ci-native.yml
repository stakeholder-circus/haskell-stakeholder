name: ci-native

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: haskell-actions/setup@6037f33647c3f17758a2356c80fc4a53d7e0685d # v2
        with:
          ghc-version: "9.10.1"
          cabal-version: "3.12.1.0"
      - run: cabal update
      - run: cabal install fourmolu hlint --ignore-project --installdir="$HOME/.local/bin" --overwrite-policy=always
      - run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: python3 scripts/validate_scaffold.py
      - run: fourmolu -m check app src test
      - run: hlint .
      - run: cabal build all
      - run: cabal test all
