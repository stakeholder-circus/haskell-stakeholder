name: security-analysis

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 5 * * 3'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflow-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - run: python -m pip install zizmor==1.29.0
      - run: zizmor --offline --strict-collection .
